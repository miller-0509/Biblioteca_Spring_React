spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:master_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:devbrain_pass}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.co.sena.adso.biblioteca=INFO

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.livereload.port=35729
# Seguridad habilitada por defecto en dev para poder probar RBAC y JWT.
# Usuarios seed: admin@email.com/Admin1234, carlos@email.com/123456, maria@email.com/654321, etc.
app.security.enabled=true

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=BibliotecaAPIDevPool

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgMjU2IGJpdHMgbWluaW11bQ==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Sistema de multas / suspensiones ──
multas.dias-gracia=1
multas.factor-libro=1
multas.factor-equipo=1

# ── Tokens de verificación / recuperación ──
tokens.expiracion-minutos=60

