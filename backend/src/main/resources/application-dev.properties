spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:master_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:devbrain_pass}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

