spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=8
spring.flyway.schemas=public

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=BibliotecaAPIProdPool

logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.co.sena.adso.biblioteca=INFO

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
app.security.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ── Sistema de multas / suspensiones ──
multas.dias-gracia=1
multas.factor-libro=1
multas.factor-equipo=1

# ── Tokens de verificación / recuperación ──
tokens.expiracion-minutos=60

# ── Enlaces de correo (verificación / recuperación) ──
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── SMTP para envío real de correos (variables desde Coolify) ──
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000
app.mail.from=${MAIL_FROM:caperamiller5@gmail.com}
app.mail.sender-name=${MAIL_SENDER_NAME:Biblioteca SENA ADSO}
