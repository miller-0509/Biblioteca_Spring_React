spring.datasource.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=public

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.pool-name=FincasAPIProdPool

logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.co.sena.adso.biblioteca=INFO

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
app.security.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# ── Sistema de multas / suspensiones ──
multas.dias-gracia=1
multas.factor-libro=1
multas.factor-equipo=1

# ── Tokens de verificación / recuperación ──
tokens.expiracion-minutos=60

