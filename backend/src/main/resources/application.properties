spring.application.name=Biblioteca_Spring_React
server.port=${SERVER_PORT:31026}
spring.profiles.active=dev

# Orígenes permitidos para CORS (separados por coma). En dev: localhost.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Deshabilitar restart para evitar conflicto de classloader con Hibernate 6 JPA
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.livereload.port=35729

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Bogota

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


