server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Buffers para respuestas y cabeceras grandes del backend (evita error 502 "upstream sent too big header")
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    client_max_body_size 50M;

    # API: se redirige al backend (BACKEND_URL se sustituye por envsubst)
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA: fallback a index.html para rutas del router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estáticos con caché
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}